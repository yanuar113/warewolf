services:
  werewolf-app:
    build: .
    container_name: werewolf-companion
    restart: unless-stopped
    ports:
  - "127.0.0.1:3010:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - werewolf-uploads:/app/uploads

volumes:
  werewolf-uploads:
    driver: local
