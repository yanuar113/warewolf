services:
  werewolf-app:
    image: werewolf-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: werewolf-companion
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - werewolf-uploads:/app/uploads

volumes:
  werewolf-uploads:
    driver: local
