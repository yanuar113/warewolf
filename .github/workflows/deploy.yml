name: Continuous Deployment (VPS aaPanel)

on:
  push:
    branches:
      - main

# Mencegah eksekusi deployment ganda secara bersamaan
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Otomatis ke VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Eksekusi Script Deploy di VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            export TARGET_DIR="/www/wwwroot/warewolf"
            echo "[GITHUB ACTIONS] Memulai deployment di VPS pada direktori $TARGET_DIR..."
            if [ ! -d "$TARGET_DIR" ]; then
              echo "[ERROR] Direktori $TARGET_DIR tidak ditemukan di VPS!"
              exit 1
            fi
            cd "$TARGET_DIR"
            chmod +x deploy.sh
            ./deploy.sh
