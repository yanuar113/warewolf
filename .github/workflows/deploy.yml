name: Deploy Otomatis ke VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: werewolf-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Werewolf
    runs-on: ubuntu-latest

    steps:
      - name: Deploy melalui SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          script_stop: true

          script: |
            set -eu

            cd /www/wwwroot/warewolf

            echo "=== Memeriksa repository ==="

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Ada perubahan lokal yang belum disimpan."
              exit 1
            fi

            echo "=== Mengambil update GitHub ==="

            git fetch origin main
            git merge --ff-only origin/main

            echo "=== Memastikan port Docker ==="

            if ! docker compose config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); p=[p for s in c.get("services",{}).values() for p in s.get("ports",[])]; sys.exit(0 if any(str(x.get("published"))=="3010" and str(x.get("target"))=="3000" for x in p) else 1)'; then
              echo "ERROR: Mapping port 3010 ke 3000 tidak ditemukan."
              echo "Periksa docker-compose.yml."
              exit 1
            fi

            echo "=== Build Docker ==="

            docker compose build

            echo "=== Menjalankan container ==="

            docker compose up -d --remove-orphans

            echo "=== Memeriksa status aplikasi ==="

            docker compose ps

            if ! docker compose ps --status running --services | grep -qx "werewolf-app"; then
              echo "ERROR: Container Werewolf tidak berjalan."
              docker compose logs --tail=100
              exit 1
            fi

            echo "=== Deployment berhasil ==="
            echo "Port VPS: 3010"
            echo "Port container: 3000"
